name: CI - Automatizacion de calidad

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Ejecutar pruebas e2e
        run: npm run test:e2e

      - name: Compilar la aplicacion
        run: npm run build
